# CI: детермінована перевірка Synera (unit-тести з кореня + a11y-аудит).
# Жодних deploy/publish/secrets. Матрицю ОС/Node додамо пізніше — тут свідомо
# зафіксовано ubuntu-latest + Node 22, щоб CI відповідав локальному еталону.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Disposable CI only; no published port or production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Existing runner uses docker exec/cp; a connection string alone is insufficient.
      - name: C03.L4 disposable case-state RLS acceptance
        env:
          SYNERA_ACCEPTANCE_DOCKER: ${{ job.services.postgres.id }}
          SYNERA_ACCEPTANCE_PG: postgres://postgres@127.0.0.1/postgres
        run: node --test neon/local_acceptance.test.mjs

      # Run psql INSIDE the same service: loopback safety checks remain meaningful,
      # with no host psql installation or mapped network port.
      - name: Meeting status guard and full-stack SQL invariants
        env:
          SYNERA_ACCEPTANCE_DOCKER: ${{ job.services.postgres.id }}
          SYNERA_ACCEPTANCE_PGPORT: '5432'
        run: |
          cat > "$RUNNER_TEMP/synera-acceptance-psql" <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i -e PGAPPNAME="${PGAPPNAME:-}" -e PGCLIENTENCODING=UTF8 "$SYNERA_ACCEPTANCE_DOCKER" psql "$@"
          SH
          chmod +x "$RUNNER_TEMP/synera-acceptance-psql"
          SYNERA_ACCEPTANCE_PSQL="$RUNNER_TEMP/synera-acceptance-psql" \
            node tools/meeting-status-guard-sql-acceptance.mjs \
            --receipt=artifacts/postgres-acceptance/meeting-status-guard.json

      - name: Profile data erasure and stale-session SQL acceptance
        env:
          SYNERA_ACCEPTANCE_DOCKER: ${{ job.services.postgres.id }}
          SYNERA_ACCEPTANCE_PGPORT: '5432'
        run: |
          export SYNERA_ACCEPTANCE_PSQL="$RUNNER_TEMP/synera-acceptance-psql"
          node tools/profile-erasure-sql-acceptance.mjs \
            --receipt=artifacts/postgres-acceptance/profile-erasure.json
          export SYNERA_ERASURE_REVIEW_BASE_DB="$(node -p "require('./artifacts/postgres-acceptance/profile-erasure.json').database")"
          node tools/profile-erasure-review1.mjs \
            --receipt=artifacts/postgres-acceptance/profile-erasure-outcome-concurrency.json
          node tools/profile-erasure-lock-review.mjs \
            --receipt=artifacts/postgres-acceptance/profile-erasure-upsert-locks.json

      - name: Privacy complete-erasure and retention-purge SQL acceptance
        env:
          SYNERA_ACCEPTANCE_DOCKER: ${{ job.services.postgres.id }}
          SYNERA_ACCEPTANCE_PGPORT: '5432'
        run: |
          SYNERA_ACCEPTANCE_PSQL="$RUNNER_TEMP/synera-acceptance-psql" \
            node tools/privacy-sql-acceptance.mjs \
            --receipt=artifacts/postgres-acceptance/privacy.json

      - name: Audit material byte boundary SQL acceptance
        env:
          SYNERA_ACCEPTANCE_DOCKER: ${{ job.services.postgres.id }}
          SYNERA_ACCEPTANCE_PGPORT: '5432'
        run: |
          SYNERA_ACCEPTANCE_PSQL="$RUNNER_TEMP/synera-acceptance-psql" \
            node tools/audit-material-sql.mjs --receipt=artifacts/postgres-acceptance/material-budget.json

      - name: Forced RLS catalog, non-superuser RPC and consent evidence acceptance
        env:
          SYNERA_ACCEPTANCE_DOCKER: ${{ job.services.postgres.id }}
          SYNERA_ACCEPTANCE_PGPORT: '5432'
        run: |
          SYNERA_ACCEPTANCE_PSQL="$RUNNER_TEMP/synera-acceptance-psql" \
            node tools/secure-sql-acceptance.mjs --receipt=artifacts/postgres-acceptance/secure.json

      - name: Upload SQL acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-acceptance
          path: artifacts/postgres-acceptance/
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # package-lock.json закомічений (перевірено git ls-files) — тому кеш npm безпечний.
          cache: npm

      # lockfile синхронізований з package.json (додано @playwright/test) — ci відтворюємо.
      - run: npm ci

      # Браузерні тести Playwright (@playwright/test) потребують chromium.
      - run: npx playwright install --with-deps chromium

      # УСІ тести запускаються з кореня: шляхи в тестах root-відносні.
      # Glob *.test.mjs розгортається bash'ем на ubuntu; другий і третій аргументи — neon-воркер і Iceberg-машини.
      - run: node --test web_launch/*.test.mjs web_launch/iceberg/*.test.mjs neon/*.test.mjs plan/v6/workflow/approval-boundary.test.mjs
      - run: node --test tools/simulation-server.test.mjs tools/simulation-runner.test.mjs tools/live-ai-smoke.test.mjs
      - run: node --test tests/pwa/*.test.mjs
      - run: node --test tests/i18n_ch/*.test.mjs
      - run: node --test tools/secure-package.test.mjs
      - run: python3 -B -m unittest discover -s tools -p test_simulation_provider.py

      # Браузерний регресійний прогін, включно з SYN_PHASE9_A11Y_E2E.
      - run: npx playwright test tests/browser-e2e.spec.mjs tests/studio-e2e.spec.mjs tests/privacy-e2e.spec.mjs tests/graphics-e2e.spec.mjs tests/graphics2-e2e.spec.mjs tests/integrate-e2e.spec.mjs tests/simulation-living.spec.mjs tests/product-access.spec.mjs tests/secure-e2e.spec.mjs tests/live-ai.spec.mjs tests/adapt-e2e.spec.mjs tests/radar-e2e.spec.mjs tests/secfix-e2e.spec.mjs
      - run: node tools/header-layout-acceptance-20261013.mjs
      - run: node neon/build.mjs dist-neon-ci
      - run: node web_launch/build.mjs
      - name: Scan both PWA release bundles for secret patterns
        run: node tools/check-client-bundle.mjs web_launch/dist-real web_launch/dist-neon-ci
      - run: node tools/offline-shell-acceptance.mjs --candidate=web_launch/dist-neon-ci
      - run: node tools/location-browser-acceptance.mjs
      - run: node tools/case-social-draft-browser.mjs
      - run: node tools/profile-erasure-browser.mjs
      - run: node tools/audit-session-cookie-browser.mjs
      - run: node tools/audit-paid-journey-browser.mjs
      - run: node tools/simulation-browser-acceptance.mjs

      # axe-core через Playwright; exit 1 при critical/serious порушеннях.
      - run: node web_launch/a11y_audit.mjs

      - name: Upload audit UI acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-ui-acceptance
          path: |
            artifacts/gemini-implementation-20261017/CASE_SOCIAL_BROWSER.json
            artifacts/gemini-implementation-20261017/ERASURE_BROWSER.json
            artifacts/gemini-implementation-20261017/result-card-390x844.png
            artifacts/gemini-implementation-20261017/profile-erasure-390x844.png
            artifacts/audit-followup-20261019/session-cookie-browser.json
            artifacts/audit-followup-20261019/paid-journey-browser/
            artifacts/android-simulation-20261020/browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            test-results/
            playwright-report/
            artifacts/header-layout-20261015/
            artifacts/offline-shell-acceptance/
            artifacts/gemini-implementation-20261017/
          if-no-files-found: ignore
          retention-days: 7

      # Тут пізніше з'явиться matrix (versions: [22, 24]) — поки зафіксовано один Node 22.
