<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>Synera Operator Cockpit — Offline Report</title>
<style>
body{font-family:system-ui,sans-serif;margin:2rem;max-width:1200px;line-height:1.5}
h1,h2{color:#1a1a2e} .fine{color:#666;font-size:.9rem} table{border-collapse:collapse;width:100%;margin:1rem 0}
th,td{border:1px solid #ddd;padding:.5rem;text-align:left} th{background:#f5f5f5}
.warning{background:#fff3cd} .critical{background:#f8d7da} .info{background:#d1ecf1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.panel{border:1px solid #eee;border-radius:8px;padding:1rem}
button{background:#0066cc;color:#fff;border:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer}
button:hover{background:#0052a3} input[type=file]{margin:1rem 0}
</style>
<h1>Synera Operator Cockpit — Offline</h1>
<p class="fine">Select <code>events.jsonl</code> to generate the report. No network — everything runs locally.</p>
<input type="file" id="file-input" accept=".jsonl,.json,.log" />
<div id="report" hidden></div>
<script>
// Pure JS compute (mirrors operator_dashboard.mjs computeDashboard)
const CORE_EVENTS = ['profile_started','profile_completed','mode_selected','candidate_viewed','case_created','approval_given','approval_withdrawn','terms_revised','intro_requested','trial_agreed','trial_completed','outcome_submitted','feedback_given','feedback_missing','dispute_opened','export_requested','delete_requested','consent_granted','consent_revoked'];
const OPERATOR_CATS = ['clarification','moderation','technical','dispute'];

function parseEvents(text) { return text.trim().split('\n').filter(l=>l.trim()).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean); }
function filterBySource(events, source) { return events.filter(e=>e.source===source); }
function uniquePairs(events) { return new Set(events.map(e=>e.properties?.pair_id).filter(Boolean)).size; }
function uniqueProfiles(events) { return new Set(events.map(e=>e.properties?.profile_id).filter(Boolean)).size; }
function modeDistribution(events) { const d={}; for(const e of events){const m=e.properties?.mode; if(m)d[m]=(d[m]||0)+1} return d; }
function cityDistribution(events) { const d={}; for(const e of events){const c=e.properties?.city_bucket; if(c)d[c]=(d[c]||0)+1} return d; }
function consentWithdrawalRate(events, hours=24) { const cutoff=Date.now()-hours*3600*1000; const rev=events.filter(e=>e.type==='consent_revoked'&&Date.parse(e.at)>cutoff).length; const gr=events.filter(e=>e.type==='consent_granted'&&Date.parse(e.at)>cutoff).length; return gr>0?rev/gr:0; }
function ghostRate(events) { const pairs=new Map(); for(const e of events){const pid=e.properties?.pair_id; if(!pid)continue; if(!pairs.has(pid))pairs.set(pid,{last:0}); const p=pairs.get(pid); p.last=Math.max(p.last,Date.parse(e.at));} let ghost=0,total=0; const now=Date.now(); for(const[,p] of pairs){total++; if(now-p.last>14*24*3600*1000)ghost++;} return total>0?ghost/total:0; }
function versionMismatch(events) { const v=new Set(events.map(e=>e.properties?.version).filter(Boolean)); return v.size>1?[...v].sort().join(', '):null; }
function dropOffRate(events) { const s=events.filter(e=>e.type==='profile_started').length; const c=events.filter(e=>e.type==='profile_completed').length; return s>0?1-c/s:0; }
function operatorLoadByCategory(events) { const load={clarification:0,moderation:0,technical:0,dispute:0}; for(const e of events){const cat=e.properties?.operator_category; const mins=e.properties?.operator_minutes; if(cat&&OPERATOR_CATS.includes(cat)&&Number.isFinite(mins))load[cat]+=mins;} return load; }
function computeAlerts(events) { const a=[]; if(consentWithdrawalRate(events)>=2/24)a.push({level:'warning',code:'CONSENT_WITHDRAWAL_SPIKE',msg:'Consent withdrawal rate ≥2/24h'}); if(events.some(e=>e.type==='dispute_opened'))a.push({level:'critical',code:'OPEN_DISPUTE',msg:'Open dispute detected'}); if(ghostRate(events)>0.25)a.push({level:'warning',code:'GHOST_RATE',msg:`Ghost rate ${Math.round(ghostRate(events)*100)}% > 25%`}); const vm=versionMismatch(events); if(vm)a.push({level:'info',code:'VERSION_MISMATCH',msg:`Multiple versions: ${vm}`}); if(dropOffRate(events)>0.3)a.push({level:'warning',code:'DROP_OFF',msg:`Drop-off ${Math.round(dropOffRate(events)*100)}% > 30%`}); return a; }
function computeDashboard(events) { const real=filterBySource(events,'real'); const synthetic=filterBySource(events,'synthetic'); const alerts=computeAlerts(real); const opLoad=operatorLoadByCategory(real); return {generatedAt:new Date().toISOString(),pilotHealth:{activePairs:uniquePairs(real),activeProfiles:uniqueProfiles(real),totalEvents:real.length,funnel:{started:real.filter(e=>e.type==='profile_started').length,completed:real.filter(e=>e.type==='profile_completed').length,casesCreated:real.filter(e=>e.type==='case_created').length,trialsAgreed:real.filter(e=>e.type==='trial_agreed').length,trialsCompleted:real.filter(e=>e.type==='trial_completed').length},missingFeedback:real.filter(e=>e.type==='feedback_missing').length,openDisputes:real.filter(e=>e.type==='dispute_opened').length},cohortQuality:{modeDistribution:modeDistribution(real),cityDistribution:cityDistribution(real),ghostRate:ghostRate(real),realVsSynthetic:{real:real.length,synthetic:synthetic.length}},operatorLoad:{categories:operatorLoadByCategory(real)},revenueSignals:{},alerts}; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));}
function fmtNum(n){return Number.isFinite(n)?n.toLocaleString():'—';}
function fmtPct(n){return Number.isFinite(n)?(n*100).toFixed(1)+'%':'—';}
function render(metrics){
  const a=metrics.alerts.map(a=>`<tr class="${a.level}"><td>${esc(a.code)}</td><td>${esc(a.msg)}</td></tr>`).join('');
  const f=metrics.pilotHealth.funnel; const fr=[['Started',f.started],['Completed',f.completed],['Cases',f.casesCreated],['Trials Agreed',f.trialsAgreed],['Trials Completed',f.trialsCompleted]].map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtNum(v)}</td></tr>`).join('');
  const mr=Object.entries(metrics.cohortQuality.modeDistribution).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtNum(v)}</td></tr>`).join('');
  const cr=Object.entries(metrics.cohortQuality.cityDistribution).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtNum(v)}</td></tr>`).join('');
  const lr=Object.entries(metrics.operatorLoad.categories).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtNum(v)} min</td></tr>`).join('');
  const ah=metrics.alerts.length?`<h2>Alerts</h2><table><thead><tr><th>Code</th><th>Message</th></tr></thead><tbody>${a}</tbody></table>`:'<h2>Alerts</h2><p class="fine">No alerts.</p>';
  return `<div class="grid"><div class="panel"><h2>Pilot Health</h2><p>Active pairs: <strong>${fmtNum(metrics.pilotHealth.activePairs)}</strong> · Active profiles: <strong>${fmtNum(metrics.pilotHealth.activeProfiles)}</strong></p><p>Missing feedback: ${fmtNum(metrics.pilotHealth.missingFeedback)} · Open disputes: ${fmtNum(metrics.pilotHealth.openDisputes)}</p><table><thead><tr><th>Stage</th><th>Count</th></tr></thead><tbody>${fr}</tbody></table></div><div class="panel"><h2>Cohort Quality</h2><p>Ghost rate: ${fmtPct(metrics.cohortQuality.ghostRate)} · Real/Synthetic: ${fmtNum(metrics.cohortQuality.realVsSynthetic.real)}/${fmtNum(metrics.cohortQuality.realVsSynthetic.synthetic)}</p><h3>Modes</h3><table><thead><tr><th>Mode</th><th>Events</th></tr></thead><tbody>${mr}</tbody></table><h3>Cities</h3><table><thead><tr><th>City</th><th>Events</th></tr></thead><tbody>${cr}</tbody></table></div><div class="panel"><h2>Operator Load</h2><table><thead><tr><th>Category</th><th>Minutes</th></tr></thead><tbody>${lr}</tbody></table></div><div class="panel"><h2>Revenue Signals</h2><p class="fine">Requires case terms correlation — not yet available from telemetry alone.</p></div></div>${ah}`;
}

document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  const events = parseEvents(text);
  const metrics = computeDashboard(events);
  document.getElementById('report').hidden = false;
  document.getElementById('report').innerHTML = render(metrics);
});

function downloadCSV(metrics) {
  function flatten(obj, pre='') { const out=[]; for(const[k,v] of Object.entries(obj)){const key=pre?pre+'.'+k:k; if(v&&typeof v==='object'&&!Array.isArray(v))out.push(...flatten(v,key)); else out.push([key,Array.isArray(v)?v.join(';'):v]);} return out; }
  const rows=[['metric','value'],...flatten(metrics)];
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='operator-dashboard-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(url);
}
</script>
</html>
